<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma Caisse">
<title>Ma Caisse</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #F5EDE3; min-height: 100vh; }

/* TOP BAR */
.top-bar { background: #5C3317; padding: 52px 16px 14px; position: sticky; top: 0; z-index: 20; }
.top-bar-inner { display: flex; align-items: center; justify-content: space-between; }
.top-bar-title { font-size: 17px; font-weight: 700; color: #FFF8F0; }
.top-bar-sub { font-size: 12px; color: #E8C99A; margin-top: 2px; }
.top-bar-count { background: #E8C99A; color: #5C3317; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 99px; }

/* PRODUCT TABS */
.prod-tabs { display: flex; background: #4A2810; border-bottom: 2px solid #3d2210; }
.prod-tab { flex: 1; padding: 11px 4px; text-align: center; font-size: 12px; font-weight: 500; color: #E8C99A; border: none; background: none; cursor: pointer; }
.prod-tab.active { background: #5C3317; color: #FFF8F0; border-bottom: 2px solid #E8C99A; }

/* NAV TABS */
.nav { display: flex; background: #3d2210; }
.nav-tab { flex: 1; padding: 10px; text-align: center; font-size: 12px; color: #D4A882; border: none; background: none; cursor: pointer; }
.nav-tab.active { background: #5C3317; color: #FFF8F0; font-weight: 600; }

/* SCREENS */
.screen { display: none; padding: 14px 14px 100px; }
.screen.active { display: block; }

/* SECTION LABELS */
.section-label { font-size: 11px; font-weight: 700; color: #8B5E3C; text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 8px; }

/* CHIPS */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 9px 14px; border-radius: 99px; border: 1.5px solid #D4A882; font-size: 13px; color: #5C3317; background: #FFF8F0; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.chip.selected { background: #5C3317; border-color: #5C3317; color: #FFF8F0; }
.chip:active { transform: scale(0.95); }

/* SIZE SELECTOR */
.size-row { display: flex; gap: 10px; margin-bottom: 4px; }
.size-btn { flex: 1; padding: 12px; border-radius: 12px; border: 1.5px solid #D4A882; font-size: 14px; font-weight: 600; color: #5C3317; background: #FFF8F0; cursor: pointer; text-align: center; }
.size-btn.selected { background: #5C3317; border-color: #5C3317; color: #FFF8F0; }

/* LIVE COST BAR */
.live-bar { background: #FFF8F0; border: 1.5px solid #E8C99A; border-radius: 12px; padding: 12px 16px; margin: 14px 0 4px; display: flex; justify-content: space-between; align-items: center; }
.live-bar-left { font-size: 12px; color: #8B5E3C; }
.live-bar-right { text-align: right; }
.live-cost-val { font-size: 20px; font-weight: 700; color: #5C3317; }
.live-price-val { font-size: 13px; color: #8B5E3C; margin-top: 1px; }

/* BUTTON */
.btn-enregistrer { width: 100%; padding: 15px; background: #5C3317; color: #FFF8F0; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
.btn-enregistrer:active { background: #3d2210; transform: scale(0.98); }

/* CARDS */
.item-card { background: #FFF8F0; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start; border: 0.5px solid #E8C99A; }
.item-num { font-size: 14px; font-weight: 700; color: #3d2210; }
.item-comp { font-size: 12px; color: #8B5E3C; margin-top: 3px; line-height: 1.4; }
.item-right { text-align: right; flex-shrink: 0; margin-left: 10px; }
.item-price { font-size: 15px; font-weight: 700; color: #5C3317; }
.item-cost { font-size: 11px; color: #8B5E3C; margin-top: 2px; }

/* TOTAL CARD */
.total-card { background: #5C3317; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.total-row-inner { display: flex; justify-content: space-between; align-items: center; }
.total-label { font-size: 13px; color: #E8C99A; }
.total-sub { font-size: 11px; color: #D4A882; margin-top: 3px; }
.total-val { font-size: 22px; font-weight: 700; color: #FFF8F0; }
.total-divider { border: none; border-top: 1px solid #8B5E3C; margin: 10px 0; }
.total-detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
.total-detail-label { color: #D4A882; }
.total-detail-val { color: #FFF8F0; font-weight: 600; }
.marge-val { color: #A8E6A3; font-weight: 700; }

/* RECAP */
.recap-card { background: #FFF8F0; border-radius: 12px; overflow: hidden; margin-bottom: 10px; border: 0.5px solid #E8C99A; }
.recap-card-header { background: #8B5E3C; color: #FFF8F0; font-size: 12px; font-weight: 700; padding: 8px 14px; text-transform: uppercase; letter-spacing: 0.05em; }
.recap-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 0.5px solid #F5E6D3; font-size: 13px; }
.recap-row:last-child { border-bottom: none; }
.recap-right { display: flex; align-items: center; gap: 8px; }
.recap-qty { font-size: 12px; color: #8B5E3C; background: #F5E6D3; padding: 2px 8px; border-radius: 99px; }
.recap-cost { font-size: 13px; font-weight: 700; color: #5C3317; }

/* FACTURE */
.facture-section { background: #FFF8F0; border-radius: 12px; overflow: hidden; margin-bottom: 10px; border: 0.5px solid #E8C99A; }
.facture-header { background: #5C3317; color: #FFF8F0; font-size: 13px; font-weight: 700; padding: 10px 14px; }
.facture-row { display: flex; justify-content: space-between; padding: 9px 14px; border-bottom: 0.5px solid #F5E6D3; font-size: 13px; }
.facture-row:last-child { border-bottom: none; }
.facture-row-label { color: #3d2210; }
.facture-row-val { font-weight: 600; color: #5C3317; }
.facture-total { background: #5C3317; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.marge-positive { color: #A8E6A3; }

/* BUTTONS */
.btn-reset { width: 100%; padding: 14px; background: #FFF8F0; color: #A32D2D; border: 1.5px solid #F09595; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
.btn-dl { width: 100%; padding: 14px; background: #E8C99A; color: #3d2210; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
.btn-dl:active { background: #D4A882; }

/* TOAST */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #3d2210; color: #FFF8F0; padding: 10px 22px; border-radius: 99px; font-size: 14px; font-weight: 500; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 99; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty { text-align: center; padding: 48px 16px; color: #D4A882; font-size: 14px; }
.empty-icon { font-size: 40px; display: block; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-bar-inner">
    <div>
      <div class="top-bar-title">🍫 Ma Caisse</div>
      <div class="top-bar-sub" id="date-display"></div>
    </div>
    <div class="top-bar-count" id="total-badge">0 ventes</div>
  </div>
</div>

<!-- PRODUCT TABS -->
<div class="prod-tabs">
  <button class="prod-tab active" onclick="setProd('pancake')">🥞 Box</button>
  <button class="prod-tab" onclick="setProd('milkshake')">🥤 Milkshake</button>
  <button class="prod-tab" onclick="setProd('mojito')">🍃 Mojito</button>
</div>

<!-- NAV TABS -->
<div class="nav">
  <button class="nav-tab active" onclick="showScreen('compose')">+ Nouvelle</button>
  <button class="nav-tab" onclick="showScreen('journal')">Journal</button>
  <button class="nav-tab" onclick="showScreen('facture')">Facture</button>
</div>

<!-- SCREEN COMPOSE -->
<div id="screen-compose" class="screen active">

  <!-- PANCAKE -->
  <div id="prod-pancake">
    <div class="section-label">Toppings</div>
    <div class="chips" id="chips-topping"></div>
    <div class="section-label">Nappages</div>
    <div class="chips" id="chips-nappage"></div>
    <div class="section-label">Suppléments</div>
    <div class="chips" id="chips-suppl"></div>
    <div class="live-bar">
      <div class="live-bar-left">Coût matière<br><span style="font-size:10px;color:#aaa">Prix de vente</span></div>
      <div class="live-bar-right">
        <div class="live-cost-val" id="pancake-live-cost">0,92 €</div>
        <div class="live-price-val" id="pancake-live-price">9,00 €</div>
      </div>
    </div>
    <button class="btn-enregistrer" onclick="addPancake()">Enregistrer la box ✓</button>
  </div>

  <!-- MILKSHAKE -->
  <div id="prod-milkshake" style="display:none">
    <div class="section-label">Taille</div>
    <div class="size-row">
      <div class="size-btn selected" id="ms-size-petit" onclick="setMsSize('petit')">Petit 300ml<br><span style="font-size:12px;font-weight:400">4,00 €</span></div>
      <div class="size-btn" id="ms-size-grand" onclick="setMsSize('grand')">Grand 500ml<br><span style="font-size:12px;font-weight:400">6,00 €</span></div>
    </div>
    <div class="section-label">Goût</div>
    <div class="chips" id="chips-ms-gout"></div>
    <div class="live-bar">
      <div class="live-bar-left">Coût matière<br><span style="font-size:10px;color:#aaa">Prix de vente</span></div>
      <div class="live-bar-right">
        <div class="live-cost-val" id="ms-live-cost">— €</div>
        <div class="live-price-val" id="ms-live-price">4,00 €</div>
      </div>
    </div>
    <button class="btn-enregistrer" onclick="addMilkshake()">Enregistrer le milkshake ✓</button>
  </div>

  <!-- MOJITO -->
  <div id="prod-mojito" style="display:none">
    <div class="section-label">Taille</div>
    <div class="size-row">
      <div class="size-btn selected" id="mj-size-petit" onclick="setMjSize('petit')">Petit 300ml<br><span style="font-size:12px;font-weight:400">4,00 €</span></div>
      <div class="size-btn" id="mj-size-grand" onclick="setMjSize('grand')">Grand 500ml<br><span style="font-size:12px;font-weight:400">6,00 €</span></div>
    </div>
    <div class="section-label">Goût</div>
    <div class="chips" id="chips-mj-gout"></div>
    <div class="live-bar">
      <div class="live-bar-left">Coût matière<br><span style="font-size:10px;color:#aaa">Prix de vente</span></div>
      <div class="live-bar-right">
        <div class="live-cost-val" id="mj-live-cost">— €</div>
        <div class="live-price-val" id="mj-live-price">4,00 €</div>
      </div>
    </div>
    <button class="btn-enregistrer" onclick="addMojito()">Enregistrer le mojito ✓</button>
  </div>
</div>

<!-- SCREEN JOURNAL -->
<div id="screen-journal" class="screen">
  <div id="journal-content"></div>
  <button class="btn-reset" onclick="resetDay()">🔄 Nouvelle journée (effacer tout)</button>
</div>

<!-- SCREEN FACTURE -->
<div id="screen-facture" class="screen">
  <div id="facture-content"></div>
  <button class="btn-dl" onclick="downloadFacture()">📥 Télécharger la facture</button>
  <button class="btn-reset" onclick="resetDay()">🔄 Nouvelle journée</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════
// DONNÉES
// ═══════════════════════════════════════════════════

const BASE_PANCAKE = 0.92;
const PRIX_BASE_PANCAKE = 9.00;

const TOPPINGS = [
  { id:'t1',  label:'Kinder Bueno',   cost: 6.86/20*1.5, isFruit: false },
  { id:'t2',  label:'K. Bueno Blanc', cost: 5.39/16*1.5, isFruit: false },
  { id:'t3',  label:'Shokobon ×5',    cost: 5.09/48*5,   isFruit: false },
  { id:'t4',  label:'K. Country',     cost: 2.09/6,       isFruit: false },
  { id:'t5',  label:'Spéculoos ×3',   cost: 2.65/1000*8*3, isFruit: false },
  { id:'t6',  label:'Biscoff',        cost: 5.66/1000*8, isFruit: false },
  { id:'t7',  label:'Kinder Maxi',    cost: 3.31/210*21, isFruit: false },
  { id:'t8',  label:'Oreo ×4',        cost: 3.22/1000*11*4, isFruit: false },
  { id:'t9',  label:'Fraises',        cost: 3.49/500*150, isFruit: true },
  { id:'t10', label:'Banane ½',       cost: 2.00/1000*60, isFruit: true },
  { id:'t11', label:'Framboises ×5',  cost: 2.69/125*5*(125/35), isFruit: true },
];
const NAPPAGES = [
  { id:'n1', label:'Nutella',        cost: 4.88/1000*40 },
  { id:'n2', label:'Pistache',       cost: 20/700*40 },
  { id:'n3', label:'El Mordjene',    cost: 9.90/700*40 },
  { id:'n4', label:'Spéculoos pâte', cost: 9.30/700*40 },
];
const SUPPLS = [
  { id:'s1', label:'Glace 3 boules', cost: 2.99/2500*225 },
  { id:'s2', label:'Chantilly',      cost: 1.30/242*60 },
];

// MILKSHAKES
const MS_BASE = {
  paille: 6.50/250,
  porteGobelet: 22.45/200,
  petit: {
    gobelet: 4.60/50,
    couvercle: 4.39/50,
    glace: 2.99/1500*120,
    lait: 0.88/1000*210,
  },
  grand: {
    gobelet: 8.40/50,
    couvercle: 8.20/50,
    glace: 2.99/1500*150,
    lait: 0.88/1000*260,
  }
};
function msBase(size) {
  return MS_BASE.paille + MS_BASE.porteGobelet + MS_BASE[size].gobelet + MS_BASE[size].couvercle + MS_BASE[size].glace + MS_BASE[size].lait;
}

const CAS = 15; // ml par cuillère à soupe
const N_NUTELLA   = p => 4.88/1000  * CAS * (p==='petit'?1:2);
const N_ELMORDJENE= p => 9.90/700   * CAS * (p==='petit'?1:2);
const N_PISTACHE  = p => 20/700     * CAS * (p==='petit'?2:3);
const N_SPECULOOS = p => 9.30/700   * CAS * (p==='petit'?1:2);

const MS_GOUTS = [
  { id:'ms1',  label:'Kinder Bueno',   cost: p => msBase(p) + 6.86/20*1.5 + N_NUTELLA(p) },
  { id:'ms2',  label:'K. Bueno Blanc', cost: p => msBase(p) + 5.39/16*1.5 + N_ELMORDJENE(p) },
  { id:'ms3',  label:'Shokobon',       cost: p => msBase(p) + 5.09/48*5   + N_NUTELLA(p) },
  { id:'ms4',  label:'K. Country',     cost: p => msBase(p) + 2.09/6      + N_NUTELLA(p) },
  { id:'ms5',  label:'Kinder Maxi',    cost: p => msBase(p) + 3.31/210*21 + N_NUTELLA(p) },
  { id:'ms6',  label:'Oreo ×3',        cost: p => msBase(p) + 3.22/1000*11*3 },
  { id:'ms7',  label:'Spéculoos',      cost: p => msBase(p) + 2.65/1000*8*2 + N_SPECULOOS(p) },
  { id:'ms8',  label:'Pistache',       cost: p => msBase(p) + N_PISTACHE(p) },
  { id:'ms9',  label:'El Mordjene',    cost: p => msBase(p) + N_ELMORDJENE(p) * (p==='petit'?2:1.5) },
  { id:'ms10', label:'Banane',         cost: p => msBase(p) + 2.00/1000*60 },
  { id:'ms11', label:'Fraise',         cost: p => msBase(p) + 3.49/500*60 },
];

// MOJITOS
const MJ_BASE_COMMUN = {
  menthe: 0.05,
  citron: 3.99/8,
  paille: 6.50/250,
  porteGobelet: 22.45/200,
};
const MJ_BASE = {
  petit: {
    gobelet: 4.60/50,
    couvercle: 4.39/50,
    limonade: 0.65/1500*260,
    glacons: 1.49/0.75/1000*100,
  },
  grand: {
    gobelet: 8.40/50,
    couvercle: 8.20/50,
    limonade: 0.65/1500*460,
    glacons: 1.49/0.75/1000*200,
  }
};
function mjBase(size) {
  const c = MJ_BASE_COMMUN;
  const s = MJ_BASE[size];
  return c.menthe + c.citron + c.paille + c.porteGobelet + s.gobelet + s.couvercle + s.limonade + s.glacons;
}
const SIROP_PML = { pasteque:13.50/700, violette:16.99/700, fraise:15.90/700, classique:19.50/700, passion:13.50/700 };
function sirop(gout, size) { return SIROP_PML[gout] * (size==='petit'?20:40); }

const MJ_GOUTS = [
  { id:'mj1', label:'Pastèque',  cost: p => mjBase(p) + sirop('pasteque', p) },
  { id:'mj2', label:'Violette',  cost: p => mjBase(p) + sirop('violette', p) },
  { id:'mj3', label:'Fraise',    cost: p => mjBase(p) + sirop('fraise', p) },
  { id:'mj4', label:'Classique', cost: p => mjBase(p) + sirop('classique', p) },
  { id:'mj5', label:'Passion',   cost: p => mjBase(p) + sirop('passion', p) },
  { id:'mj6', label:'RedBull',   cost: p => {
    const rb = MJ_BASE_COMMUN;
    const s = MJ_BASE[p];
    return rb.menthe + rb.citron + rb.paille + rb.porteGobelet
      + s.gobelet + s.couvercle + s.glacons
      + sirop('classique', p)
      + 1.23/2
      + (0.65/1500*(p==='petit'?130:230));
  }},
];

// ═══════════════════════════════════════════════════
// ÉTAT
// ═══════════════════════════════════════════════════
let currentProd = 'pancake';
let selP = { toppings: new Set(), nappages: new Set(), suppls: new Set() };
let msSize = 'petit', msGouts = new Set();
let mjSize = 'petit', mjGout = null;
let ventes = [];
try { ventes = JSON.parse(localStorage.getItem('caisse_complete') || '[]'); } catch(e) {}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function fmt(v) { return v.toFixed(2).replace('.',',') + ' €'; }
function fmtN(v) { return v.toFixed(2).replace('.',','); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function save() {
  try { localStorage.setItem('caisse_complete', JSON.stringify(ventes)); } catch(e) {}
}

function updateBadge() {
  document.getElementById('total-badge').textContent = ventes.length + ' vente' + (ventes.length>1?'s':'');
}

// ═══════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════
function setProd(prod) {
  currentProd = prod;
  document.querySelectorAll('.prod-tab').forEach((t,i) => {
    t.classList.toggle('active', ['pancake','milkshake','mojito'][i] === prod);
  });
  document.getElementById('prod-pancake').style.display   = prod==='pancake'   ? '' : 'none';
  document.getElementById('prod-milkshake').style.display = prod==='milkshake' ? '' : 'none';
  document.getElementById('prod-mojito').style.display    = prod==='mojito'    ? '' : 'none';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  const idx = ['compose','journal','facture'].indexOf(id);
  document.querySelectorAll('.nav-tab')[idx].classList.add('active');
  if (id==='journal') renderJournal();
  if (id==='facture') renderFacture();
}

// ═══════════════════════════════════════════════════
// CHIPS
// ═══════════════════════════════════════════════════
function buildChips(containerId, items, onToggle) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.id = 'chip-' + item.id;
    d.textContent = item.label;
    d.onclick = () => onToggle(item, d);
    el.appendChild(d);
  });
}

function buildSingleChips(containerId, items, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  items.forEach(item => {
    const d = document.createElement('div');
    d.className = 'chip';
    d.id = 'chip-' + item.id;
    d.textContent = item.label;
    d.onclick = () => {
      document.querySelectorAll('#' + containerId + ' .chip').forEach(c => c.classList.remove('selected'));
      d.classList.add('selected');
      onSelect(item);
    };
    el.appendChild(d);
  });
}

// ═══════════════════════════════════════════════════
// PANCAKE
// ═══════════════════════════════════════════════════
function calcPancakeCost() {
  let c = BASE_PANCAKE;
  TOPPINGS.forEach(t => { if (selP.toppings.has(t.id)) c += t.cost; });
  NAPPAGES.forEach(n => { if (selP.nappages.has(n.id)) c += n.cost; });
  SUPPLS.forEach(s   => { if (selP.suppls.has(s.id))   c += s.cost; });
  return c;
}

function calcPancakePrice() {
  // Base : 9€ pour 1 topping + 1 fruit + 1 nappage
  // +1€ par élément supplémentaire (topping, fruit, nappage, glace, chantilly)
  const toppings = TOPPINGS.filter(t => selP.toppings.has(t.id));
  const nappages = NAPPAGES.filter(n => selP.nappages.has(n.id));
  const suppls   = SUPPLS.filter(s => selP.suppls.has(s.id));
  const fruits   = toppings.filter(t => t.isFruit).length;
  const nonFruits= toppings.filter(t => !t.isFruit).length;
  // 1 topping + 1 fruit + 1 nappage inclus dans les 9€
  // chaque élément en plus = +1€
  const extraTopping = Math.max(0, nonFruits - 1);
  const extraFruit   = Math.max(0, fruits - 1);
  const extraNappage = Math.max(0, nappages.length - 1);
  const extraSuppl   = suppls.length;
  return PRIX_BASE_PANCAKE + (extraTopping + extraFruit + extraNappage + extraSuppl);
}

function updatePancakeLive() {
  document.getElementById('pancake-live-cost').textContent  = fmt(calcPancakeCost());
  document.getElementById('pancake-live-price').textContent = fmt(calcPancakePrice());
}

function addPancake() {
  const toppings = TOPPINGS.filter(t => selP.toppings.has(t.id));
  const nappages = NAPPAGES.filter(n => selP.nappages.has(n.id));
  const suppls   = SUPPLS.filter(s => selP.suppls.has(s.id));
  const cost  = calcPancakeCost();
  const price = calcPancakePrice();
  const parts = [...toppings, ...nappages, ...suppls].map(x => x.label);
  ventes.push({
    type: 'pancake', num: ventes.length+1,
    desc: parts.length ? parts.join(' · ') : 'Base seule',
    cost, price,
    time: new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})
  });
  save(); updateBadge();
  selP = { toppings: new Set(), nappages: new Set(), suppls: new Set() };
  document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
  updatePancakeLive();
  showToast('Box #' + ventes.length + ' — ' + fmt(price) + ' (coût ' + fmt(cost) + ')');
}

// ═══════════════════════════════════════════════════
// MILKSHAKE
// ═══════════════════════════════════════════════════
function setMsSize(size) {
  msSize = size;
  document.getElementById('ms-size-petit').classList.toggle('selected', size==='petit');
  document.getElementById('ms-size-grand').classList.toggle('selected', size==='grand');
  updateMsLive();
}

function calcMsPrice() {
  const n = msGouts.size;
  const base = msSize === 'petit' ? 4.00 : 6.00;
  return base + Math.max(0, n - 1) * 0.50;
}

function calcMsCost() {
  let c = 0;
  MS_GOUTS.forEach(g => { if (msGouts.has(g.id)) c += g.cost(msSize); });
  // base (gobelet etc) comptée une seule fois déjà incluse dans chaque goût
  // on soustrait les bases en double si plusieurs goûts
  if (msGouts.size > 1) {
    const baseOnce = MS_BASE.paille + MS_BASE.porteGobelet + MS_BASE[msSize].gobelet + MS_BASE[msSize].couvercle + MS_BASE[msSize].glace + MS_BASE[msSize].lait;
    c -= baseOnce * (msGouts.size - 1);
  }
  return c;
}

function updateMsLive() {
  if (!msGouts.size) { document.getElementById('ms-live-cost').textContent = '— €'; document.getElementById('ms-live-price').textContent = msSize==='petit'?'4,00 €':'6,00 €'; return; }
  document.getElementById('ms-live-cost').textContent  = fmt(calcMsCost());
  document.getElementById('ms-live-price').textContent = fmt(calcMsPrice());
}

function addMilkshake() {
  if (!msGouts.size) { showToast('Choisissez au moins un goût !'); return; }
  const cost  = calcMsCost();
  const price = calcMsPrice();
  const labels = MS_GOUTS.filter(g => msGouts.has(g.id)).map(g => g.label);
  const desc = labels.join(' + ') + ' (' + (msSize==='petit'?'Petit 300ml':'Grand 500ml') + ')';
  ventes.push({
    type: 'milkshake', num: ventes.length+1, desc, cost, price,
    time: new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})
  });
  save(); updateBadge();
  msGouts = new Set();
  document.querySelectorAll('#chips-ms-gout .chip').forEach(c => c.classList.remove('selected'));
  updateMsLive();
  showToast('Milkshake ' + labels.join('+') + ' — ' + fmt(price));
}

// ═══════════════════════════════════════════════════
// MOJITO
// ═══════════════════════════════════════════════════
function setMjSize(size) {
  mjSize = size;
  document.getElementById('mj-size-petit').classList.toggle('selected', size==='petit');
  document.getElementById('mj-size-grand').classList.toggle('selected', size==='grand');
  updateMjLive();
}

function mjBasePrice(size, goutId) {
  if (goutId === 'mj6') return size === 'petit' ? 4.50 : 6.50;
  return size === 'petit' ? 4.00 : 6.00;
}

function calcMjPrice() {
  if (!mjGout) return mjSize === 'petit' ? 4.00 : 6.00;
  const base = mjBasePrice(mjSize, mjGout);
  return base; // 1 seul goût pour mojito (pas de multi-goût mojito)
}

function updateMjLive() {
  if (!mjGout) { document.getElementById('mj-live-cost').textContent = '— €'; return; }
  const g = MJ_GOUTS.find(g => g.id === mjGout);
  document.getElementById('mj-live-cost').textContent  = fmt(g.cost(mjSize));
  document.getElementById('mj-live-price').textContent = fmt(mjBasePrice(mjSize, mjGout));
}

function addMojito() {
  if (!mjGout) { showToast('Choisissez un goût !'); return; }
  const g = MJ_GOUTS.find(g => g.id === mjGout);
  const cost  = g.cost(mjSize);
  const price = mjBasePrice(mjSize, mjGout);
  ventes.push({
    type: 'mojito', num: ventes.length+1,
    desc: 'Mojito ' + g.label + ' (' + (mjSize==='petit'?'Petit 300ml':'Grand 500ml') + ')',
    cost, price,
    time: new Date().toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'})
  });
  save(); updateBadge();
  mjGout = null;
  document.querySelectorAll('#chips-mj-gout .chip').forEach(c => c.classList.remove('selected'));
  updateMjLive();
  showToast('Mojito ' + g.label + ' — ' + fmt(price) + ' (coût ' + fmt(cost) + ')');
}

// JOURNAL
// ═══════════════════════════════════════════════════

  const el = document.getElementById('journal-content');

  const totalCA   = ventes.reduce((a,v) => a+v.price, 0);

  el.innerHTML = `
    <div class="total-card">
      <div class="total-row-inner">
        <div><div class="total-label">Chiffre d'affaires</div><div class="total-sub">${ventes.length} vente${ventes.length>1?'s':''}</div></div>
        <div class="total-val">${fmt(totalCA)}</div>
      </div>
      <hr class="total-divider">
      <div class="total-detail-row"><span class="total-detail-label">Coût matière</span><span class="total-detail-val">${fmt(totalCost)}</span></div>
      <div class="total-detail-row"><span class="total-detail-label">Marge brute</span><span class="marge-val">${fmt(marge)}</span></div>
    </div>
    ` + ventes.slice().reverse().map(v => {
      const emoji = v.type==='pancake'?'🥞':v.type==='milkshake'?'🥤':'🍃';

        <div style="flex:1;min-width:0">
          <div class="item-num">${emoji} Vente #${v.num} <span style="font-size:11px;color:#8B5E3C;font-weight:400">${v.time}</span></div>
          <div class="item-comp">${v.desc}</div>
        </div>
        <div class="item-right">
          <div class="item-price">${fmt(v.price)}</div>
          <div class="item-cost">coût ${fmt(v.cost)}</div>
        </div>
      </div>`;

}

// ═══════════════════════════════════════════════════
// FACTURE
// ═══════════════════════════════════════════════════
function renderFacture() {
  const el = document.getElementById('facture-content');
  if (!ventes.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">📊</span>Aucune vente aujourd\'hui</div>';
    return;
  }

  const date = new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const totalCA   = ventes.reduce((a,v) => a+v.price, 0);
  const totalCost = ventes.reduce((a,v) => a+v.cost, 0);
  const marge = totalCA - totalCost;
  const tauxMarge = (marge/totalCA*100).toFixed(1);

  // Grouper par type
  const byType = { pancake: [], milkshake: [], mojito: [] };
  ventes.forEach(v => byType[v.type].push(v));

  function typeSection(label, emoji, items) {
    if (!items.length) return '';
    const ca   = items.reduce((a,v) => a+v.price, 0);
    const cost = items.reduce((a,v) => a+v.cost, 0);
    // compter par desc
    const counts = {};
    items.forEach(v => { counts[v.desc] = (counts[v.desc]||{count:0,ca:0,cost:0}); counts[v.desc].count++; counts[v.desc].ca+=v.price; counts[v.desc].cost+=v.cost; });
    const rows = Object.entries(counts).map(([desc, d]) =>
      `<div class="facture-row">
        <span class="facture-row-label">${desc} ×${d.count}</span>
        <span class="facture-row-val">${fmt(d.ca)}</span>
      </div>`
    ).join('');
    return `<div class="facture-section">
      <div class="facture-header">${emoji} ${label} (${items.length})</div>
      ${rows}
      <div class="facture-row" style="background:#F5E6D3">
        <span style="font-weight:700;color:#3d2210">Sous-total</span>
        <span style="font-weight:700;color:#5C3317">${fmt(ca)}</span>
      </div>
    </div>`;
  }

  el.innerHTML = `
    <div style="text-align:center;margin-bottom:14px">
      <div style="font-size:16px;font-weight:700;color:#3d2210">📄 Récap journalier</div>
      <div style="font-size:12px;color:#8B5E3C;margin-top:3px">${date}</div>
    </div>

    <div class="facture-total">
      <div class="total-row-inner">
        <div><div class="total-label">CA total</div><div class="total-sub">${ventes.length} vente${ventes.length>1?'s':''}</div></div>
        <div class="total-val">${fmt(totalCA)}</div>
      </div>
      <hr class="total-divider">
      <div class="total-detail-row"><span class="total-detail-label">Coût matière total</span><span class="total-detail-val">${fmt(totalCost)}</span></div>
      <div class="total-detail-row"><span class="total-detail-label">Marge brute</span><span class="marge-val">${fmt(marge)} (${tauxMarge}%)</span></div>
    </div>

    ${typeSection('Box Pancakes','🥞', byType.pancake)}
    ${typeSection('Milkshakes','🥤', byType.milkshake)}
    ${typeSection('Mojitos','🍃', byType.mojito)}

    <div class="facture-section">
      <div class="facture-header">📦 Résumé coûts matière</div>
      <div class="facture-row"><span class="facture-row-label">Box Pancakes</span><span class="facture-row-val">${fmt(byType.pancake.reduce((a,v)=>a+v.cost,0))}</span></div>
      <div class="facture-row"><span class="facture-row-label">Milkshakes</span><span class="facture-row-val">${fmt(byType.milkshake.reduce((a,v)=>a+v.cost,0))}</span></div>
      <div class="facture-row"><span class="facture-row-label">Mojitos</span><span class="facture-row-val">${fmt(byType.mojito.reduce((a,v)=>a+v.cost,0))}</span></div>
      <div class="facture-row" style="background:#F5E6D3"><span style="font-weight:700;color:#3d2210">Total marchandise</span><span style="font-weight:700;color:#5C3317">${fmt(totalCost)}</span></div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════
// TÉLÉCHARGEMENT FACTURE
// ═══════════════════════════════════════════════════
function downloadFacture() {
  if (!ventes.length) { showToast('Aucune vente à exporter'); return; }

  const date = new Date().toLocaleDateString('fr-BE',{day:'2-digit',month:'2-digit',year:'numeric'});
  const totalCA   = ventes.reduce((a,v) => a+v.price, 0);
  const totalCost = ventes.reduce((a,v) => a+v.cost, 0);
  const marge = totalCA - totalCost;
  const tauxMarge = (marge/totalCA*100).toFixed(1);

  const byType = { pancake: [], milkshake: [], mojito: [] };
  ventes.forEach(v => byType[v.type].push(v));

  function typeTxt(label, items) {
    if (!items.length) return '';
    const counts = {};
    items.forEach(v => { if(!counts[v.desc]) counts[v.desc]={count:0,ca:0,cost:0}; counts[v.desc].count++; counts[v.desc].ca+=v.price; counts[v.desc].cost+=v.cost; });
    return `\n── ${label} (${items.length}) ──\n`
      + Object.entries(counts).map(([d,x]) => `  ${d} ×${x.count} → ${fmt(x.ca)}`).join('\n')
      + `\n  Sous-total : ${fmt(items.reduce((a,v)=>a+v.price,0))}`;
  }

  const txt = `╔══════════════════════════════════╗
║       RÉCAP JOURNALIER           ║
║       ${date}              ║
╚══════════════════════════════════╝

RÉSUMÉ
  Ventes totales    : ${ventes.length}
  Chiffre d'affaires: ${fmt(totalCA)}
  Coût matière      : ${fmt(totalCost)}
  Marge brute       : ${fmt(marge)} (${tauxMarge}%)

DÉTAIL PAR PRODUIT
${typeTxt('Box Pancakes 🥞', byType.pancake)}
${typeTxt('Milkshakes 🥤', byType.milkshake)}
${typeTxt('Mojitos 🍃', byType.mojito)}

DÉTAIL COÛTS MATIÈRE
  Box Pancakes : ${fmt(byType.pancake.reduce((a,v)=>a+v.cost,0))}
  Milkshakes   : ${fmt(byType.milkshake.reduce((a,v)=>a+v.cost,0))}
  Mojitos      : ${fmt(byType.mojito.reduce((a,v)=>a+v.cost,0))}
  TOTAL        : ${fmt(totalCost)}

Généré le ${new Date().toLocaleString('fr-BE')}`;

  const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'facture_' + date.replace(/\//g,'-') + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Facture téléchargée !');
}

// ═══════════════════════════════════════════════════
// RESET
// ═══════════════════════════════════════════════════
function resetDay() {
  if (!confirm('Démarrer une nouvelle journée ?\nToutes les ventes seront effacées.')) return;
  ventes = [];
  try { localStorage.removeItem('caisse_complete'); } catch(e) {}
  updateBadge();
  showToast('Nouvelle journée démarrée');
  showScreen('compose');
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
document.getElementById('date-display').textContent = new Date().toLocaleDateString('fr-BE',{weekday:'long',day:'numeric',month:'long'});

buildChips('chips-topping', TOPPINGS, (item, chip) => {
  if (selP.toppings.has(item.id)) { selP.toppings.delete(item.id); chip.classList.remove('selected'); }
  else { selP.toppings.add(item.id); chip.classList.add('selected'); }
  updatePancakeLive();
});
buildChips('chips-nappage', NAPPAGES, (item, chip) => {
  if (selP.nappages.has(item.id)) { selP.nappages.delete(item.id); chip.classList.remove('selected'); }
  else { selP.nappages.add(item.id); chip.classList.add('selected'); }
  updatePancakeLive();
});
buildChips('chips-suppl', SUPPLS, (item, chip) => {
  if (selP.suppls.has(item.id)) { selP.suppls.delete(item.id); chip.classList.remove('selected'); }
  else { selP.suppls.add(item.id); chip.classList.add('selected'); }
  updatePancakeLive();
});

buildChips('chips-ms-gout', MS_GOUTS, (item, chip) => {
  if (msGouts.has(item.id)) { msGouts.delete(item.id); chip.classList.remove('selected'); }
  else { msGouts.add(item.id); chip.classList.add('selected'); }
  updateMsLive();
});
buildSingleChips('chips-mj-gout', MJ_GOUTS, item => { mjGout = item.id; updateMjLive(); });

updateBadge();
</script>
